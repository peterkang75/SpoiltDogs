<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');

  html, body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1920px;
    background: transparent;
    overflow: hidden;
  }

  .container {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .content {
    position: absolute;
    top: 120px;
    left: 0;
    right: 0;
    bottom: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  .text-main {
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 80px;
    color: #FCF9F1;
    text-align: center;
    line-height: 1.15;
    padding: 0 80px;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
  }

  .badge {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    transform: translateY(calc(-100% - 240px));
    text-align: center;
    z-index: 1;
  }

  .badge-inner {
    display: inline-block;
    background: #FFD54F;
    color: #1A3A2E;
    padding: 8px 24px;
    border-radius: 100px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .badge-inner:empty {
    display: none;
  }

  .brand {
    position: absolute;
    bottom: 180px;
    right: 64px;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 24px;
    color: #FFD54F;
    z-index: 2;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
  }
</style>
</head>
<body>
  <div class="container">
    <div class="badge"><span class="badge-inner">{{label}}</span></div>
    <div class="content">
      <div class="text-main">{{text}}</div>
    </div>
    <div class="brand">Spoilt Dogs</div>
  </div>
</body>
</html>
